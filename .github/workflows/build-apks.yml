name: Build Jukebox APKs

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Publish = every build that can end up on devices via the updater.
      # These runs MUST be signed with the single Jukebox release key.
      # jukebox-p0-tv is the working TV branch: every merge there ships to the
      # gazebo Fire TV, same as master and v* tags.
      PUBLISH_RUN: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/jukebox-p0-tv' }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compute publish versionCode
        # Rolling publish must strictly increase versionCode or the TV's
        # updater silently ignores the new manifest (see docs/UPDATES.md).
        # Base comes from gradle.properties; the live manifest at
        # https://jukebox.tfour.net/install/latest.json tells us what may
        # already be published. Publish max(base, published + 1).
        # Only jukebox-p0-tv gets the bump: tags/master publish the
        # versionCode from the tree, and scripts/upload-to-r2.sh refuses
        # anything not strictly greater than published, so a tag can never
        # downgrade the live manifest.
        if: github.ref == 'refs/heads/jukebox-p0-tv'
        run: |
          BASE="$(grep -E '^jukeboxVersionCode=[0-9]+$' gradle.properties | cut -d= -f2)"
          if [[ ! "$BASE" =~ ^[0-9]+$ ]]; then
            echo "::error::could not read jukeboxVersionCode from gradle.properties"
            exit 1
          fi
          NEXT="$BASE"
          LIVE_JSON="$RUNNER_TEMP/published-latest.json"
          HTTP_CODE="$(curl -sS -o "$LIVE_JSON" -w '%{http_code}' --max-time 20 https://jukebox.tfour.net/install/latest.json)" || HTTP_CODE="000"
          case "$HTTP_CODE" in
            200)
              PUBLISHED="$(jq -r '(.jukebox.versionCode // ([to_entries[] | select(.key != "package") | .value.versionCode // empty] | max)) // empty' "$LIVE_JSON")"
              if [[ ! "$PUBLISHED" =~ ^[0-9]+$ ]]; then
                echo "::error::published latest.json has no numeric versionCode"
                exit 1
              fi
              if (( PUBLISHED >= NEXT )); then
                NEXT=$((PUBLISHED + 1))
              fi
              echo "live manifest is versionCode $PUBLISHED; publishing $NEXT"
              ;;
            404)
              echo "::warning::no live manifest at https://jukebox.tfour.net/install/latest.json (first publish?) — publishing base versionCode $NEXT"
              ;;
            *)
              echo "::error::could not fetch published manifest (HTTP $HTTP_CODE) — refusing to guess"
              exit 1
              ;;
          esac
          echo "JUKEBOX_VERSION_CODE=$NEXT" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager --install "ndk;21.0.6113669" "build-tools;30.0.3" "platforms;android-34"

      - name: Set up signing keystore
        env:
          JUKEBOX_KEYSTORE_B64: ${{ secrets.JUKEBOX_KEYSTORE_B64 }}
          JUKEBOX_KEYSTORE_PASSWORD: ${{ secrets.JUKEBOX_KEYSTORE_PASSWORD }}
          JUKEBOX_KEY_ALIAS: ${{ secrets.JUKEBOX_KEY_ALIAS }}
          JUKEBOX_KEY_PASSWORD: ${{ secrets.JUKEBOX_KEY_PASSWORD }}
        run: |
          if [ -n "$JUKEBOX_KEYSTORE_B64" ]; then
            echo "$JUKEBOX_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jukebox.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$RUNNER_TEMP/jukebox.jks" "$JUKEBOX_KEYSTORE_PASSWORD" "$JUKEBOX_KEY_ALIAS" "$JUKEBOX_KEY_PASSWORD" \
              > "$RUNNER_TEMP/keystore.properties"
            echo "JUKEBOX_KEYSTORE_PROPERTIES=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          elif [ "$PUBLISH_RUN" = "true" ]; then
            # Tags, master and jukebox-p0-tv are published (GitHub Release +
            # install manifest); an unsigned or differently-signed build there
            # would brick in-app updates for users, so refuse.
            echo "::error::Signing secrets missing on a publish run (tag/master/jukebox-p0-tv). Refusing to build."
            exit 1
          else
            # Branch build without secrets: sign with the debug key so the APK is installable,
            # but it is NOT publishable (no manifest, artifact marked unsigned-dev).
            KS="$RUNNER_TEMP/debug.jks"
            keytool -genkeypair -keystore "$KS" -storepass android -keypass android \
              -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -validity 10000
            printf 'storeFile=%s\nstorePassword=android\nkeyAlias=androiddebugkey\nkeyPassword=android\n' \
              "$KS" > "$RUNNER_TEMP/keystore.properties"
            echo "JUKEBOX_KEYSTORE_PROPERTIES=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::JUKEBOX_KEYSTORE_B64 is empty; branch build signed with the debug key (not publishable)."
          fi

      - name: Run unit tests (stjukebox)
        run: bash ./gradlew --no-daemon :smarttubetv:testStjukeboxDebugUnitTest :common:testStjukeboxDebugUnitTest

      - name: Build Jukebox (stjukebox release)
        run: |
          if [ -n "${JUKEBOX_VERSION_CODE:-}" ]; then
            # jukebox-p0-tv publish run: build with the bumped versionCode
            # computed above so this rolling publish strictly increases.
            bash ./gradlew --no-daemon "-PjukeboxVersionCode=$JUKEBOX_VERSION_CODE" :smarttubetv:assembleStjukeboxRelease
          else
            bash ./gradlew --no-daemon :smarttubetv:assembleStjukeboxRelease
          fi

      - name: Make update manifest (latest.json)
        if: env.PUBLISH_RUN == 'true'
        env:
          JUKEBOX_COMMIT: ${{ github.sha }}
        run: |
          # Deterministic builtAt: commit time (fall back to git for non-push events)
          EPOCH="$(git log -1 --pretty=%ct)"
          SOURCE_DATE_EPOCH="$EPOCH" \
            scripts/make-update-manifest.sh \
            smarttubetv/build/outputs/apk/stjukebox/release \
            smarttubetv/build/outputs/apk/stjukebox/release/latest.json

      - name: Compute artifact name
        run: |
          if [ "$PUBLISH_RUN" = "true" ]; then
            NAME="jukebox-apks"
          elif [ "$SIGNED" = "true" ]; then
            NAME="jukebox-apks-signed"  # branch build with the real key: signed but not published
          else
            NAME="jukebox-apks-unsigned-dev"  # debug-key branch build; never publish this
          fi
          echo "ARTIFACT_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload APKs (artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          path: |
            smarttubetv/build/outputs/apk/stjukebox/release/Jukebox_*_armeabi-v7a.apk
            smarttubetv/build/outputs/apk/stjukebox/release/Jukebox_*_arm64-v8a.apk

      - name: Upload update manifest (artifact)
        # latest.json only exists on publish runs (tag/master/jukebox-p0-tv); skip on branch builds
        if: env.PUBLISH_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jukebox-update-manifest
          if-no-files-found: error
          path: smarttubetv/build/outputs/apk/stjukebox/release/latest.json

      - name: Attach APKs + manifest to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            smarttubetv/build/outputs/apk/stjukebox/release/Jukebox_*_armeabi-v7a.apk
            smarttubetv/build/outputs/apk/stjukebox/release/Jukebox_*_arm64-v8a.apk
            smarttubetv/build/outputs/apk/stjukebox/release/latest.json

      - name: Move rolling release tag (jukebox-p0-tv)
        # The rolling release always points at the newest merged jukebox-p0-tv
        # build. softprops/action-gh-release updates a release for an existing
        # tag but does not move the tag itself, so move it here first.
        if: github.ref == 'refs/heads/jukebox-p0-tv'
        run: |
          git tag -f p0-tv-latest HEAD
          git push -f origin p0-tv-latest

      - name: Publish rolling GitHub Release (jukebox-p0-tv)
        if: github.ref == 'refs/heads/jukebox-p0-tv'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: p0-tv-latest
          target_commitish: jukebox-p0-tv
          name: Jukebox TV — jukebox-p0-tv latest
          body: |
            Rolling build of the `jukebox-p0-tv` branch — updated on every merge.
            This is the build the gazebo Fire TV picks up via the in-app updater
            (manifest: https://jukebox.tfour.net/install/latest.json).
            Commit: ${{ github.sha }}
          files: |
            smarttubetv/build/outputs/apk/stjukebox/release/Jukebox_*_armeabi-v7a.apk
            smarttubetv/build/outputs/apk/stjukebox/release/Jukebox_*_arm64-v8a.apk
            smarttubetv/build/outputs/apk/stjukebox/release/latest.json

      - name: Check R2 credentials
        # Secrets landed 2026-11-19 (scoped token from Bou — see docs/UPDATES.md).
        # Record whether the upload can run; a publish run without them still
        # publishes the GitHub Release + manifest above, and warns instead of
        # failing, so merges are never blocked on the token.
        env:
          JUKEBOX_R2_ACCOUNT_ID: ${{ secrets.JUKEBOX_R2_ACCOUNT_ID }}
          JUKEBOX_R2_ACCESS_KEY_ID: ${{ secrets.JUKEBOX_R2_ACCESS_KEY_ID }}
          JUKEBOX_R2_SECRET_ACCESS_KEY: ${{ secrets.JUKEBOX_R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$JUKEBOX_R2_ACCOUNT_ID" ] && [ -n "$JUKEBOX_R2_ACCESS_KEY_ID" ] && [ -n "$JUKEBOX_R2_SECRET_ACCESS_KEY" ]; then
            echo "R2_CONFIGURED=true" >> "$GITHUB_ENV"
          else
            echo "R2_CONFIGURED=false" >> "$GITHUB_ENV"
            if [ "$PUBLISH_RUN" = "true" ]; then
              echo "::warning::R2 upload skipped: set the JUKEBOX_R2_ACCOUNT_ID, JUKEBOX_R2_ACCESS_KEY_ID and JUKEBOX_R2_SECRET_ACCESS_KEY secrets (scoped R2 token from Bou) to publish APKs to jukebox.tfour.net. The GitHub Release above still published."
            fi
          fi

      - name: Upload to R2 (self-updater)
        # Order matters: APKs first (each verified against the manifest),
        # latest.json LAST — see scripts/upload-to-r2.sh and docs/UPDATES.md.
        # Tags and master pushes publish to R2 too (same PUBLISH_RUN as the
        # release flow); scripts/upload-to-r2.sh refuses any versionCode not
        # strictly greater than the live manifest, so a tag can never
        # downgrade it.
        if: env.PUBLISH_RUN == 'true' && env.R2_CONFIGURED == 'true'
        env:
          JUKEBOX_R2_ACCOUNT_ID: ${{ secrets.JUKEBOX_R2_ACCOUNT_ID }}
          JUKEBOX_R2_ACCESS_KEY_ID: ${{ secrets.JUKEBOX_R2_ACCESS_KEY_ID }}
          JUKEBOX_R2_SECRET_ACCESS_KEY: ${{ secrets.JUKEBOX_R2_SECRET_ACCESS_KEY }}
        run: |
          bash scripts/upload-to-r2.sh \
            smarttubetv/build/outputs/apk/stjukebox/release \
            smarttubetv/build/outputs/apk/stjukebox/release/latest.json

  emulator-smoke:
    runs-on: ubuntu-latest
    # Belt-and-braces: a healthy smoke run takes 7–9 min. If an adb call ever
    # wedges again, fail the job at 30 min instead of hanging to the 6h default
    # (run 44760700925 sat 33+ min in one `adb logcat -d` before it was cancelled).
    timeout-minutes: 30
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager --install "ndk;21.0.6113669" "build-tools;30.0.3" "platforms;android-34" "platforms;android-26" "system-images;android-26;google_apis;x86_64"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avdcache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-26-x86_64-google_apis-v1

      - name: Build + install + launch smoke test on emulator (api 26)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 900
          force-avd-creation: false
          # -no-snapshot-load: always cold-boot. The AVD cache restores a Quick Boot
          # snapshot saved on a different runner host; the run that booted from it
          # died in the runner's own boot sequence (adb `input keyevent 82` killed
          # with exit 137) before the smoke script ever started, while the cold-boot
          # run passed. A cold boot costs ~20s and removes the host-tied snapshot
          # from the boot path entirely.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot-load
          disable-animations: true
          script: bash .github/scripts/emulator-smoke.sh
