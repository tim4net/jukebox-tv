# Merge gate — PIT mutation check (Tim's new PR flow, 2026-11-20).
#
# Job 2 of the gate, per Bob's spec (Del thread 2026-11-20): PIT on the
# changed classes under net.tfour.jukebox only, threshold "no surviving
# mutant on a changed line, or >=80% mutation score on the changed classes
# with every survivor listed". Runs on the `mutate` label and nightly —
# NEVER on every push. In particular it is NOT attached to
# .github/workflows/build-apks.yml (which already runs on every branch
# push). The risky-paths job (cheap, every PR) lives in merge-gate.yml.
#
# The `mutate` label is the on-ramp: add it to a PR to run the check there.
# Nightly runs the same check over the classes changed in the last 24h on
# the default branch, reusing PIT's incremental history (cached).

name: Merge gate — mutation

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  schedule:
    - cron: "0 2 * * *" # nightly, 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutate:
    name: PIT mutation check
    # PR runs only carry the `mutate` label; nightly / dispatch always run.
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'mutate') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: merge-gate-mutate-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager --install "ndk;21.0.6113669" "build-tools;30.0.3" "platforms;android-34"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore PIT history (incremental runs)
        uses: actions/cache@v4
        with:
          path: |
            common/build/pitest-history.txt
            smarttubetv/build/pitest-history.txt
          # Keyed by branch so PR runs start from the base branch's history.
          key: pitest-history-${{ github.event.pull_request.base.ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            pitest-history-${{ github.event.pull_request.base.ref || github.ref_name }}-

      - name: Map PR diff to PIT targets
        id: targets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            BASE="$BASE_SHA"
          else
            # Nightly / dispatch: classes changed in the last 24 hours.
            BASE="$(git rev-list --before='24 hours ago' -n 1 HEAD)"
            echo "Nightly base: $BASE"
          fi
          BASE_SHA="$BASE" OUT=pitest-targets.json node scripts/merge-gate/pitest-targets.mjs
          # Export per-module target lists for the Gradle steps below.
          node -e '
            const t = require("./pitest-targets.json");
            const fs = require("fs");
            const out = [];
            for (const [mod, m] of Object.entries(t.modules)) {
              out.push(`${mod.toUpperCase()}_CLASSES=${m.targetClasses.join(",")}`);
              out.push(`${mod.toUpperCase()}_TESTS=${m.targetTests.join(",")}`);
            }
            fs.appendFileSync(process.env.GITHUB_ENV, out.join("\n") + "\n");
          '
          node -e '
            const t = require("./pitest-targets.json");
            const n = Object.values(t.modules).reduce((s, m) => s + m.targetClasses.length, 0);
            console.log(`PIT targets: ${n} changed class(es)`);
            if (n === 0) console.log("No Jukebox classes changed — mutation job has nothing to do.");
          '

      - name: PIT — common
        if: env.COMMON_CLASSES != ''
        run: |
          bash ./gradlew --no-daemon :common:pitestMutate \
            -PpitestTargetClasses="$COMMON_CLASSES" \
            -PpitestTargetTests="$COMMON_TESTS"

      - name: PIT — smarttubetv
        if: env.SMARTTUBETV_CLASSES != ''
        run: |
          bash ./gradlew --no-daemon :smarttubetv:pitestMutate \
            -PpitestTargetClasses="$SMARTTUBETV_CLASSES" \
            -PpitestTargetTests="$SMARTTUBETV_TESTS"

      - name: Enforce the mutation threshold
        # Runs even when a PIT step failed, so the report names the cause.
        # (A missing report for a module that had targets is a failure.)
        if: always()
        env:
          CONFIG: .github/merge-gate.config.json
        run: node scripts/merge-gate/pitest-check.mjs --targets pitest-targets.json

      - name: Upload PIT reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-reports
          if-no-files-found: warn
          path: |
            common/build/reports/pitest/
            smarttubetv/build/reports/pitest/
            pitest-targets.json
